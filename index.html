<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>每日複盤</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#2b2a28;--mute:#77736c;--line:#e4e1da;--up:#d0312d;--dn:#16884a;--acc:#0054a7;--th:#eef2f6}
@media (prefers-color-scheme:dark){:root{--bg:#141517;--card:#1d1f22;--ink:#e6e4df;--mute:#9a968e;--line:#2f3236;--up:#ff6b61;--dn:#4fcf8a;--acc:#6aa8ff;--th:#24282d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Microsoft JhengHei","PingFang TC",sans-serif}
#gate{min-height:100vh;display:grid;place-items:center;padding:16px}
#gate form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;width:100%;max-width:340px}
#gate h1{font-size:20px;margin:0 0 4px}#gate p{color:var(--mute);margin:0 0 16px;font-size:13px}
#gate input[type=password]{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#gate button{margin-top:12px;width:100%;padding:10px;font-size:15px;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}
#gate label{display:flex;gap:6px;align-items:center;margin-top:10px;font-size:13px;color:var(--mute)}
#err{color:var(--up);font-size:13px;min-height:1.2em;margin-top:8px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .top{display:flex;justify-content:space-between;align-items:baseline;max-width:1100px;margin:auto;padding:10px 16px 0}
header .top small{color:var(--mute)}
nav{display:flex;gap:6px;overflow-x:auto;max-width:1100px;margin:auto;padding:8px 16px 10px;scrollbar-width:none}
nav a{flex:none;font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;background:var(--card)}
main{max-width:1100px;margin:auto;padding:8px 16px 48px}
main>h1{display:none}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 16px 12px;margin:14px 0;scroll-margin-top:100px}
h2{font-size:18px;margin:14px 0 8px}h3{font-size:15px;margin:16px 0 6px;color:var(--acc)}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;min-width:3.5em}
th{background:var(--th);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
.up{color:var(--up)}.dn{color:var(--dn)}
blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--line);color:var(--mute);font-size:13px}
img{max-width:100%;height:auto;display:block;margin:10px auto;border-radius:6px;background:#fff}
ul{padding-left:20px}
.cap{margin:10px 0 0;font-size:13px;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0}
.tiles div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}.tiles small{display:block;color:var(--mute)}.tiles b{font-size:18px;font-variant-numeric:tabular-nums}
details{margin:6px 0 12px}summary{cursor:pointer;font-size:13px;color:var(--acc)}
details.full>summary{font-size:13px;padding:6px 0;border-top:1px dashed var(--line);margin-top:8px}
.tiles em{display:block;font-style:normal;font-size:12px;color:var(--mute)}
.hbs{margin:4px 0 10px}
.hb{display:grid;grid-template-columns:minmax(6.5em,34%) 1fr auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.hl{font-size:14px;line-height:1.25;overflow:hidden}.hl small{display:block;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht{position:relative;height:14px;background:var(--th);border-radius:3px}
.ht i{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--mute)}
.ht b{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--mute)}
.ht b.up{background:var(--up)}.ht b.nu{background:var(--acc)}.ht b.dn{background:var(--dn)}
.hv{font-size:14px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:4.5em}
.pb{margin:10px 0}.pbh{display:flex;justify-content:space-between;font-weight:600}
.pbt{height:12px;background:var(--th);border-radius:6px;overflow:hidden;margin:4px 0}.pbt b{display:block;height:100%;background:var(--acc)}
.pb small{color:var(--mute);font-size:12px}
.lst>div{display:grid;grid-template-columns:4.2em 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.lst small{display:block;font-size:11px;color:var(--mute)}.lst .d{font-weight:600;font-variant-numeric:tabular-nums}.lst b{font-variant-numeric:tabular-nums}
.gauge{margin:10px 0}.gh{display:flex;justify-content:space-between;align-items:baseline}.gh b{font-size:26px}.gh small{font-size:13px;color:var(--mute)}
.gt{position:relative;height:12px;border-radius:6px;margin:6px 0 2px;background:linear-gradient(90deg,#3aa76d 0 30%,#e0b33a 30% 55%,#e8783a 55% 75%,#d0312d 75%)}
.gt i{position:absolute;top:-4px;width:4px;height:20px;margin-left:-2px;background:var(--ink);border-radius:2px}
.gl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin:8px 0}
.cards>div{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.cards .r1,.cards .r2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cards .r1 small,.cards .r2 small{color:var(--mute);font-size:12px}.cards .r2{margin-top:2px;font-variant-numeric:tabular-nums}
.cards .r2 b{font-size:16px}
@media (max-width:640px){
 body{font-size:16px}
 main{padding:4px 10px 40px}
 section{padding:2px 12px 10px;border-radius:10px}
 header .top{padding:8px 12px 0}nav{padding:6px 12px 8px}
 .tiles{grid-template-columns:repeat(3,1fr);gap:6px}.tiles div{padding:6px 8px}.tiles b{font-size:17px}.tiles small,.tiles em{font-size:11px}
 td:first-child{white-space:nowrap}
 table{font-size:12px}
}
</style></head><body>

<label><input type="checkbox" id="rm">在這台裝置記住</label>
<button>解鎖</button><div id="err"></div></form></div>
<div id="app" hidden></div>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(P.s),iterations:310000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
  const t=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.i)},key,b(P.c)));
  return t;
}
const nf=(x,d=0)=>x.toLocaleString("zh-TW",{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=(x,d=0)=>(x>0?"+":x<0?"-":"")+nf(Math.abs(x),d), cl=x=>x>0?"up":x<0?"dn":"";
function live(){
  const el=document.getElementById("live"),H=JSON.parse(document.getElementById("hd").textContent);
  let T={v:0,c:0,p:0,d:0},R="";
  for(const h of H.rows){
    const q=h.tw,px=h.px,y=h.y,v=h.sh*px;
    const tax=h.code.startsWith("00")?0.001:0.003,net=v-Math.floor(v*0.001425)-Math.floor(v*tax),pnl=net-h.cost;
    const dd=y?h.sh*(px-y):0,chg=y?(px-y)/y*100:0;
    T.v+=v;T.c+=h.cost;T.p+=pnl;T.d+=dd;
    R+=`<tr><td>${h.code}<br><small>${h.name}</small></td><td>${h.blk}</td><td class="n">${nf(h.sh)}</td><td class="n">${nf(h.cost/h.sh,2)}</td>`+
      `<td class="n">${nf(px,2)}${q?"":"*"}</td><td class="n ${cl(chg)}">${y?sg(chg,2)+"%":"—"}</td><td class="n ${cl(dd)}">${y?sg(dd):"—"}</td>`+
      `<td class="n">${nf(v)}</td><td class="n ${cl(pnl)}">${sg(pnl)}</td><td class="n ${cl(pnl)}">${sg(pnl/h.cost*100,2)}%</td></tr>`;
  }
  const C=H.rows.map(h=>{const v=h.sh*h.px,tax=h.code.startsWith("00")?0.001:0.003,p=v-Math.floor(v*0.001425)-Math.floor(v*tax)-h.cost,
      d=h.y?h.sh*(h.px-h.y):0,c=h.y?(h.px-h.y)/h.y*100:0;return{h,v,p,d,c}}).sort((a,b)=>b.v-a.v).map(o=>
    `<div><div class="r1"><span><b>${o.h.code}</b> ${o.h.name}</span><span>${nf(o.h.px,2)}${o.h.tw?"":"*"} <span class="${cl(o.c)}">${o.h.y?sg(o.c,2)+"%":"—"}</span></span></div>`+
    `<div class="r2"><span><small>今日</small> <b class="${cl(o.d)}">${o.h.y?sg(o.d):"—"}</b></span><span><small>未實現</small> <b class="${cl(o.p)}">${sg(o.p)}</b> <small class="${cl(o.p)}">${sg(o.p/o.h.cost*100,1)}%</small></span></div>`+
    `<div class="r1"><small>${o.h.blk} · ${nf(o.h.sh)} 股 · 均 ${nf(o.h.cost/o.h.sh,2)}</small><small>市值 ${nf(o.v)}</small></div></div>`).join("");
  el.innerHTML=`<h2>收盤未實現損益</h2><p><small>收盤價 ${H.at||"未取得,顯示券商檔價格"}(證交所) · 持股 ${H.asof} 券商檔 · * 為券商價</small></p>`+
    `<div class="tiles"><div><small>今日損益</small><b class="${cl(T.d)}">${sg(T.d)}</b></div><div><small>未實現損益</small><b class="${cl(T.p)}">${sg(T.p)}</b><em>${sg(T.p/T.c*100,2)}%</em></div>`+
    `<div><small>市值</small><b>${nf(T.v)}</b><em>成本 ${nf(T.c)}</em></div></div><div class="cards">${C}</div>`+
    `<details class="full"><summary>完整表格</summary><div class="tw"><table><tr><th>標的</th><th>區塊</th><th class="n">股數</th><th class="n">均價</th><th class="n">現價</th><th class="n">漲跌</th><th class="n">今日損益</th><th class="n">市值</th><th class="n">未實現損益</th><th class="n">報酬率</th></tr>${R}`+
    `<tr><th colspan="6">合計(成本 ${nf(T.c)})</th><th class="n ${cl(T.d)}">${sg(T.d)}</th><th class="n">${nf(T.v)}</th><th class="n ${cl(T.p)}">${sg(T.p)}</th><th class="n ${cl(T.p)}">${sg(T.p/T.c*100,2)}%</th></tr></table></div></details>`;
}

function show(h){
  const a=document.getElementById("app");a.innerHTML=h;a.hidden=false;document.getElementById("gate").remove();
  live();
  a.querySelectorAll("table").forEach(t=>{const w=document.createElement("div");w.className="tw";t.before(w);w.append(t)});
  a.querySelectorAll("td,th").forEach(c=>{
    const t=c.textContent.trim();
    if(/^[+\-]?[\d,.]+%?$/.test(t)||/^[+\-][\d,.]/.test(t))c.classList.add("n");
    if(c.tagName==="TD"){if(/^\+\d/.test(t)&&t!=="+0"&&t!=="+0.00%")c.classList.add("up");else if(/^-\d/.test(t))c.classList.add("dn");}
  });
}
async function go(pw,remember){
  try{const h=await open_(pw);if(remember)try{localStorage.setItem("pfpw",pw)}catch(e){}show(h);return true}
  catch(e){try{localStorage.removeItem("pfpw")}catch(_){}return false}
}
document.getElementById("f").onsubmit=async e=>{e.preventDefault();
  document.getElementById("err").textContent="解密中…";
  if(!await go(pw.value,rm.checked))document.getElementById("err").textContent="密碼錯誤";};
(async()=>{let s=null;try{s=localStorage.getItem("pfpw")}catch(e){}if(s)await go(s,false)})();
</script></body></html>
